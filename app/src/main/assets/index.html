<title>Électronique numérique 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout : établi de labo — scène 3D de la maquette à gauche, fiche de manip à droite (empilées sur téléphone) */
:root{
  --bg:#e9eee9; --panel:#f7f9f6; --ink:#1b2420; --muted:#56635b; --line:#c9d3cb;
  --accent:#0d6b5f; --accent-ink:#ffffff; --hi:#d9273f; --hi-soft:#fde4e8; --row:#e3f1ec;
  --stage:#dfe6e0;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#18201d; --ink:#e3ebe6; --muted:#9aa9a1; --line:#2c3833;
  --accent:#3cc7b2; --accent-ink:#0b1412; --hi:#ff5a72; --hi-soft:#3a1b22; --row:#1f3530;
  --stage:#1b2421; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#18201d; --ink:#e3ebe6; --muted:#9aa9a1; --line:#2c3833;
  --accent:#3cc7b2; --accent-ink:#0b1412; --hi:#ff5a72; --hi-soft:#3a1b22; --row:#1f3530;
  --stage:#1b2421; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.4vw,42px);line-height:1;margin:4px 0 0;text-wrap:balance}
h1 span{color:var(--accent)}
.author{display:inline-block;margin-top:10px;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,26px);letter-spacing:.03em;color:var(--accent);border-top:2px solid var(--accent);padding-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.navs{display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:0}
@media (max-width:860px){.navs{align-items:flex-start}}
.tps{display:flex;gap:0;border:1px solid var(--accent);border-radius:7px;overflow:hidden}
.tp{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.04em;padding:6px 18px;border:0;background:var(--panel);color:var(--accent);cursor:pointer}
.tp+.tp{border-left:1px solid var(--accent)}
.tp[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tab{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.02em;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%;min-height:300px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:4px;border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;line-height:1.05}
.chipref{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.panel p{margin:0;color:var(--muted);max-width:62ch}
.ctrls{display:flex;flex-wrap:wrap;gap:6px}
.ctrls button{font-family:var(--f-mono);font-size:13px;padding:6px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-width:58px}
.ctrls button.on{background:var(--hi);border-color:var(--hi);color:#fff}
.ctrls button.act{border-color:var(--accent);color:var(--accent);font-weight:600}
.ctrls button.act.run{background:var(--accent);color:var(--accent-ink)}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:center}
th{color:var(--muted);font-weight:600}
td:last-child{text-align:left;font-family:var(--f-body)}
tr.cur td{background:var(--row);font-weight:600}
tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.chrono{width:100%;height:150px;display:block}
.note{font-size:13.5px;border-left:3px solid var(--hi);padding:4px 0 4px 10px;color:var(--ink)}
.state{font-family:var(--f-mono);font-size:13px;display:flex;flex-wrap:wrap;gap:6px}
.state b{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.state b.h{background:var(--hi);border-color:var(--hi);color:#fff}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Module d'Électronique numérique · Travaux pratiques</div>
      <h1 id="tpTitle">Les circuits logiques séquentiels</h1>
      <div class="author">Pr. Hicham MESBAH</div>
    </div>
    <div class="navs"><nav class="tps" id="tps" aria-label="Choix du TP"></nav><nav class="tabs" role="tablist" id="tabs"></nav></div>
  </header>
  <main>
    <div class="stage" id="stage"><div class="hint">Glisser : tourner · molette / pincer : zoom · cliquer un interrupteur</div></div>
    <section class="panel" id="panel">
      <div><h2 id="ttl"></h2><div class="chipref" id="ref"></div></div>
      <p id="desc"></p>
      <div class="lbl">Commandes</div>
      <div class="ctrls" id="ctrls"></div>
      <div class="state" id="state"></div>
      <div class="lbl">Table de vérité</div>
      <div class="tbl"><table id="tbl"></table></div>
      <div class="lbl">Chronogramme (enregistré en direct)</div>
      <canvas class="chrono" id="chrono"></canvas>
      <div class="note" id="note"></div>
    </section>
  </main>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
(function(){
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,4/3,0.1,200);
camera.position.set(0,13,11);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.47; controls.minDistance=6; controls.maxDistance=34;
scene.add(new THREE.HemisphereLight(0xffffff,0x667766,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.75); sun.position.set(6,14,8); scene.add(sun);
function setBg(){scene.background=new THREE.Color(css('--stage')||'#dfe6e0')}
setBg(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{setBg();drawChrono()});
new MutationObserver(()=>{setBg();drawChrono()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- helpers 3D ---------- */
let group=new THREE.Group(); scene.add(group); let clickables=[];
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function board(W,D){
  const tex=canvasTex(1400,Math.round(1400*D/W),(g,w,h)=>{
    g.fillStyle='#f3f1ea';g.fillRect(0,0,w,h);
    const rail=(y,col)=>{g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.moveTo(30,y);g.lineTo(w-30,y);g.stroke()};
    rail(28,'#d33');rail(70,'#36c');rail(h-70,'#d33');rail(h-28,'#36c');
    g.fillStyle='#9a978d';
    for(let x=40;x<w-30;x+=22){for(const y of[42,56,h-56,h-42])g.fillRect(x,y,7,7);
      for(let y=110;y<h-110;y+=22){if(Math.abs(y-h/2)<20)continue;g.fillRect(x,y,7,7)}}
    g.fillStyle='#d9d5c8';g.fillRect(30,h/2-9,w-60,18);
    g.font='bold 22px IBM Plex Mono, monospace';g.fillStyle='#d33';g.fillText('+5 V',w-110,22);g.fillStyle='#36c';g.fillText('GND',w-100,96);
  });
  const m=new THREE.Mesh(new THREE.BoxGeometry(W,0.4,D),[0,0,new THREE.MeshStandardMaterial({map:tex,roughness:.9}),0,0,0].map(x=>x||new THREE.MeshStandardMaterial({color:0xe2ded2,roughness:.9})));
  m.position.y=-0.2; group.add(m);
  return {railP:-D/2+0.33, railN:-D/2+0.6, railP2:D/2-0.6, railN2:D/2-0.33};
}
function label(text,x,y,z,size=0.42,color='#1b2420',bg='rgba(255,255,255,0.85)'){
  const c=document.createElement('canvas');const g=c.getContext('2d');
  const f=64;g.font=`600 ${f}px IBM Plex Mono, monospace`;const tw=g.measureText(text).width;
  c.width=tw+40;c.height=f+30;g.font=`600 ${f}px IBM Plex Mono, monospace`;
  g.fillStyle=bg;g.beginPath();g.roundRect?g.roundRect(0,0,c.width,c.height,16):g.rect(0,0,c.width,c.height);g.fill();
  g.fillStyle=color;g.textBaseline='middle';g.fillText(text,20,c.height/2+2);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
  s.scale.set(size*c.width/c.height,size,1);s.position.set(x,y,z);s.renderOrder=5;group.add(s);
  s.userData.set=(t)=>{group.remove(s);const n=label(t,x,y,z,size,color,bg);return n};
  return s;
}
function chip(name,n,x,z,names){
  const half=n/2, sp=0.5, L=half*sp+0.3, Dd=1.3;
  const tex=canvasTex(1024,Math.round(1024*Dd/L),(g,w,h)=>{
    g.fillStyle='#232323';g.fillRect(0,0,w,h);
    g.fillStyle='#3a3a3a';g.beginPath();g.arc(0,h/2,h*0.13,-Math.PI/2,Math.PI/2);g.fill();
    g.fillStyle='#eee';g.font=`bold ${h*0.24}px IBM Plex Mono, monospace`;g.textAlign='center';g.textBaseline='middle';g.fillText(name,w/2,h/2);
    g.font=`${h*0.105}px IBM Plex Mono, monospace`;
    for(let i=0;i<half;i++){const px=(0.15+i*sp+sp/2)/L*w;
      g.fillStyle='#bbb';g.fillText(String(i+1),px,h*0.86);g.fillText(String(n-i),px,h*0.14);
      g.fillStyle='#ffd27a';g.fillText(names[i]||'',px,h*0.71);g.fillText(names[n-1-i]||'',px,h*0.29);}
  });
  const mats=[0,0,new THREE.MeshStandardMaterial({map:tex,roughness:.6}),0,0,0].map(m=>m||new THREE.MeshStandardMaterial({color:0x202020,roughness:.6}));
  const body=new THREE.Mesh(new THREE.BoxGeometry(L,0.38,Dd),mats);body.position.set(x,0.28,z);group.add(body);
  const pm=new THREE.MeshStandardMaterial({color:0xb8bcc2,metalness:.8,roughness:.3});
  const P={};
  for(let i=0;i<half;i++){const px=x-L/2+0.15+i*sp+sp/2;
    for(const [k,zz] of [[i+1,z+Dd/2+0.08],[n-i,z-Dd/2-0.08]]){
      const pin=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.3,0.16),pm);pin.position.set(px,0.12,zz);group.add(pin);
      P[k]=new THREE.Vector3(px,0.05,zz+(k<=half?0.12:-0.12));}}
  return P;
}
const WC={red:0xd32f2f,blue:0x2f5fd3,green:0x1e9a46,yellow:0xe0b000,orange:0xe07a1f,purple:0x8e44ad,white:0xdddddd,grey:0x666666};
function wire(a,b,col='green',h=0.6){
  const A=a.clone(),B=b.clone();const m1=A.clone();m1.y+=h;const m2=B.clone();m2.y+=h;
  const curve=new THREE.CatmullRomCurve3([A,m1,m1.clone().lerp(m2,0.5).setY(h+0.15),m2,B]);
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,40,0.045,6,false),new THREE.MeshStandardMaterial({color:WC[col]||col,roughness:.5}));
  group.add(mesh);return mesh;
}
const V=(x,z,y=0.05)=>new THREE.Vector3(x,y,z);
function toggleSwitch(x,z,name,get,set){
  const base=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.3,1.0),new THREE.MeshStandardMaterial({color:0x2b3a8f}));
  base.position.set(x,0.15,z);group.add(base);
  const knob=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.28,0.38),new THREE.MeshStandardMaterial({color:0xeeeeee}));
  group.add(knob);
  let lab=label('',x,1.0,z,0.4);
  const o={pos:V(x,z+0.5),refresh(){const v=get();knob.position.set(x,0.38,z+(v?-0.22:0.22));knob.material.color.set(v?0xff4a63:0xeeeeee);
    lab=lab.userData.set(`${name}=${v}`)}};
  [base,knob].forEach(m=>{m.userData.click=()=>{set(1-get());};clickables.push(m)});
  o.refresh();return o;
}
function pushButton(x,z,name,act,col=0x0d6b5f){
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,0.35,24),new THREE.MeshStandardMaterial({color:col}));
  b.position.set(x,0.2,z);group.add(b);b.userData.click=act;clickables.push(b);
  label(name,x,0.95,z,0.36);return {pos:V(x,z+0.4),mesh:b};
}
function led(x,z,name,color=0xff2a3c){
  const mOff=new THREE.MeshStandardMaterial({color:new THREE.Color(color).multiplyScalar(0.35),roughness:.3,transparent:true,opacity:.9});
  const dome=new THREE.Mesh(new THREE.SphereGeometry(0.22,20,14,0,Math.PI*2,0,Math.PI/2),mOff);
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.3,20),mOff);
  cyl.position.set(x,0.25,z);dome.position.set(x,0.4,z);group.add(cyl,dome);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  glow.scale.set(1.6,1.6,1);glow.position.set(x,0.45,z);group.add(glow);
  // résistance
  const r=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.45,10),new THREE.MeshStandardMaterial({color:0xc9a26b}));
  r.rotation.x=Math.PI/2;r.position.set(x,0.12,z+0.55);group.add(r);
  label(name,x,1.05,z,0.38);
  return {pos:V(x,z+0.85),set(v){mOff.emissive=new THREE.Color(v?color:0x000000);mOff.emissiveIntensity=v?1.4:0;glow.visible=!!v}};
}
const glowTex=canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h)});
function sevenSeg(x,z){
  const base=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.3,2.4),new THREE.MeshStandardMaterial({color:0x151515}));
  base.position.set(x,0.2,z);group.add(base);
  const S={},w=0.75,t=0.13;
  const defs={a:[0,-0.85,1],b:[0.42,-0.43,0],c:[0.42,0.43,0],d:[0,0.85,1],e:[-0.42,0.43,0],f:[-0.42,-0.43,0],g:[0,0,1]};
  for(const k in defs){const [dx,dz,hz]=defs[k];const m=new THREE.MeshStandardMaterial({color:0x3a1010});
    const seg=new THREE.Mesh(new THREE.BoxGeometry(hz?w:t,0.06,hz?t:w),m);seg.position.set(x+dx,0.38,z+dz);group.add(seg);S[k]=m}
  const DIG=['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];
  return {set(d){const on=typeof d==='string'?d:(DIG[d]||'');for(const k in S){S[k].color.set(on.includes(k)?0xff3030:0x3a1010);S[k].emissive=new THREE.Color(on.includes(k)?0xff1010:0);S[k].emissiveIntensity=on.includes(k)?0.9:0}},
    pins:{a:V(x-0.6,z-1.3),b:V(x-0.3,z-1.3),c:V(x,z-1.3),d:V(x+0.3,z-1.3),e:V(x+0.6,z-1.3),f:V(x-0.45,z+1.3),g:V(x+0.45,z+1.3)}};
}
function clearScene(){scene.remove(group);group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map&&m.map!==glowTex)m.map.dispose();m.dispose()})}});group=new THREE.Group();scene.add(group);clickables=[]}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY]});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(clickables)[0];
  if(hit&&hit.object.userData.click)hit.object.userData.click();
});
renderer.domElement.addEventListener('pointermove',e=>{
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);renderer.domElement.style.cursor=ray.intersectObjects(clickables).length?'pointer':'grab';
});

/* ---------- chronogramme ---------- */
let hist=[],sigNames=[];
function record(snap){hist.push(snap);if(hist.length>34)hist.shift();drawChrono()}
function drawChrono(){
  const c=document.getElementById('chrono');const dpr=Math.min(devicePixelRatio,2);
  c.style.height=Math.max(110,sigNames.length*30)+'px';const W=c.clientWidth,H=c.clientHeight;if(!W)return;c.width=W*dpr;c.height=H*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  const n=sigNames.length;if(!n)return;const rowH=H/n,lx=40,step=(W-lx-6)/34;
  const cols=[css('--muted'),css('--accent'),css('--hi'),'#4a78d0','#c98a1a','#8e44ad','#2e9a5a'];
  g.font='600 12px IBM Plex Mono, monospace';g.textBaseline='middle';
  sigNames.forEach((s,i)=>{const y0=i*rowH+rowH*0.8,amp=rowH*0.55;
    g.fillStyle=css('--ink');g.fillText(s,4,y0-amp/2);
    g.strokeStyle=css('--line');g.lineWidth=1;g.beginPath();g.moveTo(lx,y0);g.lineTo(W,y0);g.stroke();
    g.strokeStyle=cols[i%cols.length];g.lineWidth=2;g.beginPath();
    hist.forEach((h,k)=>{const v=h[s]?1:0,x=lx+k*step,y=y0-v*amp;
      if(k===0)g.moveTo(x,y);else{const pv=hist[k-1][s]?1:0;g.lineTo(x,y0-pv*amp);g.lineTo(x,y)}g.lineTo(x+step,y)});
    g.stroke();});
}

/* ---------- panneau ---------- */
const $=id=>document.getElementById(id);
let cur=null,timer=null;
function renderPanel(){
  const E=cur;$('ctrls').innerHTML='';
  E.controls().forEach(b=>{const el=document.createElement('button');el.textContent=b.label;el.id='c-'+b.id;
    if(b.type==='act')el.className='act'+(b.run?' run':'');else if(b.on)el.className='on';
    el.onclick=b.fn;$('ctrls').appendChild(el)});
  const t=E.table();let h='<thead><tr>'+t.head.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
  t.rows.forEach((r,i)=>{h+=`<tr class="${i===t.cur?'cur':''}">`+r.map(x=>`<td>${x}</td>`).join('')+'</tr>'});
  $('tbl').innerHTML=h+'</tbody>';
  $('state').innerHTML=E.state().map(([k,v])=>`<b class="${v===1?'h':''}">${k} = ${v}</b>`).join('');
}
function refresh(){cur.sync();renderPanel()}

  const mk=(k,x,pin,col)=>{const sw=toggleSwitch(x,2.7,k,()=>s[k],v=>{s[k]=v;this.log();refresh()});wire(sw.pos,P[pin],col,0.8+Math.abs(x)*0.08);return sw};
  this.sw={SR:mk('SR',-7.6,2,'orange'),A:mk('A',-6.2,3,'yellow'),B:mk('B',-4.8,4,'yellow'),C:mk('C',-3.4,5,'yellow'),D:mk('D',-2.0,6,'yellow'),SL:mk('SL',-0.6,7,'orange')};

 log(){const s=this.st;record({H:s.H,QA:s.Q[0],QB:s.Q[1],QC:s.Q[2],QD:s.Q[3]})},

/* ================= TP1 & TP2 (logique combinatoire) ================= */
const NG=['1A','1B','1Y','2A','2B','2Y','GND','3Y','3A','3B','4Y','4A','4B','Vcc']; // 7408/7432/7486
const NN=['1A','1Y','2A','2Y','3A','3Y','GND','4Y','4A','5Y','5A','6Y','6A','Vcc']; // 7404
function powerChip(P,n,b){const v=n===14?[14,7]:[16,8];wire(P[v[0]],V(P[v[0]].x,b.railP),'red',0.35);wire(P[v[1]],V(P[v[1]].x,b.railN2),'blue',0.35)}
function rebuild(){clearScene();cur.build();refresh()}
function bits(n,w){return [...Array(w)].map((_,i)=>(n>>(w-1-i))&1).join('')}
function comb(cfg){
  const E={tab:cfg.tab,title:cfg.title,ref:cfg.ref,desc:cfg.desc,note:cfg.note,st:Object.assign({},cfg.init||{}),cfg};
  cfg.inputs.forEach(k=>{if(E.st[k]===undefined)E.st[k]=0});
  E.sigs=cfg.sigs||[...cfg.inputs,...cfg.outputs.map(o=>o.n)];
  E.out=()=>Object.fromEntries(cfg.outputs.map(o=>[o.n,o.f(E.st)?1:0]));
  E.sw={};E.leds={};
  E.mkSw=(k,x,z)=>{const w=toggleSwitch(x,z,k,()=>E.st[k],v=>{E.st[k]=v;E.log();refresh()});E.sw[k]=w;return w};
  E.build=function(){this.sw={};this.leds={};this.seg=null;cfg.build.call(this,this.st)};
  E.log=function(){record(Object.assign({},this.st,this.out()))};
  E.sync=function(){Object.values(this.sw).forEach(w=>w.refresh());const o=this.out();for(const k in this.leds)this.leds[k].set(o[k]);if(cfg.sync)cfg.sync.call(this,o)};
  E.controls=function(){return (cfg.ctrlInputs||cfg.inputs).map(k=>({id:k,label:`${k} = ${this.st[k]}`,on:this.st[k],fn:()=>{this.st[k]^=1;this.log();refresh()}})).concat(cfg.extra?cfg.extra.call(this):[])};
  E.state=function(){return cfg.state?cfg.state.call(this):cfg.outputs.map(o=>[o.n,this.out()[o.n]])};
  E.table=function(){if(cfg.table)return cfg.table.call(this);
    const ins=cfg.inputs,n=ins.length,rows=[];
    for(let i=0;i<(1<<n);i++){const s=Object.assign({},this.st);ins.forEach((k,j)=>s[k]=(i>>(n-1-j))&1);rows.push([...ins.map(k=>s[k]),...cfg.outputs.map(o=>o.f(s)?1:0)])}
    const curI=ins.reduce((a,k)=>a*2+this.st[k],0);return{head:[...ins,...cfg.outputs.map(o=>o.n)],rows,cur:curI}};
  return E;
}

  camera.position.set(0,13.5,11.5);controls.target.set(0,0,0)},
 sync(){this.seg.set(HEX[v4(this.st,'E')])},
 state(){const n=v4(this.st,'E');return[['Binaire',bits(n,4)],['Affiché',n.toString(16).toUpperCase()]]},
 table(){const n=v4(this.st,'E');return{head:['E3E2E1E0','Chiffre','Segments allumés'],rows:HEX.map((m,i)=>[bits(i,4),i.toString(16).toUpperCase(),m]),cur:n}}});

/* ----- TP2 b : UAL 1 bit ----- */
const OPS=['A·B (ET)','A + B (OU)','B̄ (NON)','A + B + Rin (addition)'];
EXP.ual=comb({tab:'UAL 1 bit',title:'Unité arithmétique et logique 1 bit',ref:'Partie théorie · décodeur 2→4 + portes ET de validation',
 desc:'F1 F0 commandent le décodeur qui valide une seule opération. 00 : ET, 01 : OU, 10 : NON B, 11 : addition avec retenue d\'entrée Rin.',
 note:'Le décodeur active une seule ligne de validation : les autres résultats sont bloqués par leurs portes ET. Rout ne vaut 1 que pendant l\'addition (11).',
 inputs:['F1','F0','A','B','Rin'],sigs:['F1','F0','A','B','Rin','R','Rout'],
 outputs:[{n:'R',f:s=>[s.A&s.B,s.A|s.B,1-s.B,s.A^s.B^s.Rin][s.F1*2+s.F0]},{n:'Rout',f:s=>s.F1&&s.F0&&((s.A&s.B)|(s.Rin&(s.A^s.B)))}],
 build(){const b=board(18,10.5);
  const D=chip('DÉC 2→4',8,-3.0,-2.2,['F0','F1','','GND','L3','L2','L1','L0']);
  const U=chip('UAL 1 bit',14,2.4,0.6,['A','B','Rin','L0','L1','L2','GND','L3','','','','Rout','R','Vcc']);
  ['F1','F0'].forEach((k,i)=>{const w=this.mkSw(k,-8.4+i*1.4,-3.4);wire(V(w.pos.x,w.pos.z-1.0),D[2-i],'purple',0.7)});
  ['A','B','Rin'].forEach((k,i)=>{const w=this.mkSw(k,-8.4+i*1.4,2.9);wire(w.pos,U[i+1],'orange',0.8+i*0.2)});
  wire(D[8],U[4],'yellow',1.2);wire(D[7],U[5],'yellow',1.4);wire(D[6],U[6],'yellow',1.6);wire(D[5],U[8],'yellow',1.8);
  this.leds.R=led(6.8,3.0,'R');this.leds.Rout=led(8.2,3.0,'Rout',0xff9a1a);
  wire(U[13],V(6.8,2.8),'green',1.2);wire(U[12],V(8.2,2.8),'green',1.4);
  camera.position.set(0,13.5,11.5);controls.target.set(0,0,0)},
 state(){const s=this.st;return[['Opération',OPS[s.F1*2+s.F0]],['R',this.out().R],['Rout',this.out().Rout]]},
 table(){const s=this.st;return{head:['F1','F0','Opération'],rows:OPS.map((o,i)=>[i>>1,i&1,o]),cur:s.F1*2+s.F0}}});

/* ----- TP2 c : comparateur 7485 ----- */
const A4=['A3','A2','A1','A0'],B4=['B3','B2','B1','B0'];
function setNum(st,p,n){for(let i=0;i<4;i++)st[p+i]=(n>>i)&1}
const CMP_TP=[[3,7],[12,10],[9,2],[11,15]];
EXP.cmp=comb({tab:'Comparateur 7485',title:'Comparateur 4 bits 7485',ref:'Brochage du polycopié · Vcc 16, GND 8',
 desc:'Règle A et B en binaire avec les interrupteurs ou les boutons du tableau du TP. Les entrées de cascade sont fixées : A>B = 0, A=B = 1, A<B = 0.',
 note:'Le 7485 compare d\'abord les bits de poids fort (A3, B3) ; s\'ils sont égaux il passe aux suivants. Une seule des trois sorties est à 1.',
 inputs:[...A4,...B4],sigs:['A>B','A=B','A<B'],init:{A3:0,A2:0,A1:1,A0:1,B3:0,B2:1,B1:1,B0:1},
 outputs:[{n:'A>B',f:s=>v4(s,'A')>v4(s,'B')},{n:'A=B',f:s=>v4(s,'A')===v4(s,'B')},{n:'A<B',f:s=>v4(s,'A')<v4(s,'B')}],
 build(){const b=board(20,11);const P=chip('7485',16,1.2,-1.4,['B3','A>B in','A=B in','A<B in','A>B','A=B','A<B','GND','B0','A0','B1','A1','A2','B2','A3','Vcc']);powerChip(P,16,b);
  const pa={A0:10,A1:12,A2:13,A3:15},pb={B0:9,B1:11,B2:14,B3:1};
  A4.forEach((k,i)=>{const w=this.mkSw(k,-9.2+i*1.25,-3.6);wire(V(w.pos.x,w.pos.z-1.0),P[pa[k]],'orange',0.8+i*0.15)});
  B4.forEach((k,i)=>{const w=this.mkSw(k,-9.2+i*1.25,2.9);wire(w.pos,P[pb[k]],'yellow',0.8+i*0.2)});
  wire(P[3],V(P[3].x,b.railP2),'red',0.3);wire(P[2],V(P[2].x,b.railN2),'blue',0.3);wire(P[4],V(P[4].x,b.railN2),'blue',0.3);
  [['A>B',5,0xff2a3c],['A=B',6,0x22c55e],['A<B',7,0x3b82f6]].forEach(([n,p,c],i)=>{this.leds[n]=led(6.6+i*1.3,2.9,n,c);wire(P[p],V(6.6+i*1.3,2.7),'green',1.0+i*0.2)});
  label('A',-7.3,1.2,-4.8,0.4);label('B',-7.3,1.2,1.7,0.4);camera.position.set(0,14.5,12.5);controls.target.set(0,0,-0.2)},
 extra(){return CMP_TP.map(([a,b])=>({id:`t${a}_${b}`,type:'act',label:`${a} / ${b}`,fn:()=>{setNum(this.st,'A',a);setNum(this.st,'B',b);this.log();refresh()}}))},
 state(){const s=this.st,a=v4(s,'A'),b=v4(s,'B');return[['A',`${a} = ${bits(a,4)}`],['B',`${b} = ${bits(b,4)}`],...Object.entries(this.out())]},
 table(){const s=this.st,a=v4(s,'A'),b=v4(s,'B');const rows=CMP_TP.map(([x,y])=>[x,y,bits(x,4),bits(y,4),+(x>y),+(x<y),+(x===y)]);
  return{head:['A','B','A (bin)','B (bin)','A>B','A<B','A=B'],rows,cur:CMP_TP.findIndex(([x,y])=>x===a&&y===b)}}});

/* ----- TP2 d : additionneur 7483 ----- */
const ADD_TP=[[3,7],[12,10],[9,2],[11,15],[15,15]];
EXP.add=comb({tab:'Additionneur 7483',title:'Additionneur 4 bits 7483',ref:'Brochage du polycopié · Vcc 5, GND 12',
 desc:'Règle A, B et la retenue d\'entrée Rin. Les LED S3…S0 et Rout donnent le résultat sur 5 bits.',
 note:'Le plus grand calcul possible est 15 + 15 + 1 = 31 = 1 1111 : Rout joue le rôle du 5e bit. Rin sert à chaîner deux 7483 pour additionner sur 8 bits.',
 inputs:[...A4,...B4,'Rin'],sigs:['Rin','S3','S2','S1','S0','Rout'],init:{A3:0,A2:0,A1:1,A0:1,B3:0,B2:1,B1:1,B0:1},
 outputs:[0,1,2,3].map(i=>({n:'S'+i,f:s=>((v4(s,'A')+v4(s,'B')+s.Rin)>>i)&1})).concat([{n:'Rout',f:s=>(v4(s,'A')+v4(s,'B')+s.Rin)>>4}]),
 build(){const b=board(20,11);const P=chip('7483',16,1.2,-1.4,['A3','S2','A2','B2','Vcc','S1','B1','A1','S0','A0','B0','GND','Rin','Rout','S3','B3']);
  wire(P[5],V(P[5].x,b.railP2),'red',0.35);wire(P[12],V(P[12].x,b.railN),'blue',0.35);
  const pa={A0:10,A1:8,A2:3,A3:1},pb={B0:11,B1:7,B2:4,B3:16};
  A4.forEach((k,i)=>{const w=this.mkSw(k,-9.2+i*1.25,2.9);wire(w.pos,P[pa[k]],'orange',0.8+i*0.2)});
  B4.forEach((k,i)=>{const w=this.mkSw(k,-9.2+i*1.25,-3.6);wire(V(w.pos.x,w.pos.z-1.0),P[pb[k]],'yellow',0.8+i*0.15)});
  const r=this.mkSw('Rin',-3.6,-3.6);wire(V(r.pos.x,r.pos.z-1.0),P[13],'purple',0.9);
  [['Rout',14],['S3',15],['S2',2],['S1',6],['S0',9]].forEach(([n,p],i)=>{this.leds[n]=led(4.6+i*1.2,2.9,n,n==='Rout'?0xff9a1a:0xff2a3c);wire(P[p],V(4.6+i*1.2,2.7),'green',0.9+i*0.15)});
  label('A',-7.3,1.2,1.7,0.4);label('B',-7.3,1.2,-4.8,0.4);camera.position.set(0,14.5,12.5);controls.target.set(0,0,-0.2)},
 extra(){return ADD_TP.map(([a,b])=>({id:`t${a}_${b}`,type:'act',label:`${a} + ${b}`,fn:()=>{setNum(this.st,'A',a);setNum(this.st,'B',b);this.log();refresh()}}))},
 state(){const s=this.st,a=v4(s,'A'),b=v4(s,'B'),t=a+b+s.Rin;return[['A',`${a} = ${bits(a,4)}`],['B',`${b} = ${bits(b,4)}`],['Somme',`${t} = ${t>>4} ${bits(t&15,4)}`]]},
 table(){const s=this.st,a=v4(s,'A'),b=v4(s,'B');const rows=ADD_TP.map(([x,y])=>{const t=x+y+s.Rin;return[x,y,bits(x,4),bits(y,4),bits(t&15,4),t>>4]});
  return{head:['A','B','A (bin)','B (bin)','S (bin)','Rout'],rows,cur:ADD_TP.findIndex(([x,y])=>x===a&&y===b)}}});

/* ----- TP2 e : multiplexeur 74153 ----- */
EXP.mux=comb({tab:'Multiplexeur 74153',title:'Multiplexeur 4 → 1 (74153, première moitié)',ref:'Brochage du polycopié · Vcc 16, GND 8',
 desc:'Les entrées de sélection B A choisissent laquelle des données 1C0 à 1C3 est recopiée sur la sortie 1Y. G (strobe) doit être à 0 pour valider.',
 note:'Rôle du strobe G : actif à l\'état bas. G = 1 force la sortie à 0, quelles que soient les autres entrées. Un multiplexeur sert d\'aiguillage : il envoie une voie parmi quatre vers une ligne unique.',
 inputs:['G','B','A','C0','C1','C2','C3'],sigs:['G','B','A','Y'],init:{C1:1,C3:1},
 outputs:[{n:'Y',f:s=>!s.G&&s['C'+(s.B*2+s.A)]}],
 build(){const b=board(20,11);const P=chip('74153',16,1.6,-1.4,['G1','B','1C3','1C2','1C1','1C0','1Y','GND','2Y','2C0','2C1','2C2','2C3','A','G2','Vcc']);powerChip(P,16,b);
  const mk=(k,x,z,p,col,h)=>{const w=this.mkSw(k,x,z);wire(z<0?V(w.pos.x,w.pos.z-1.0):w.pos,P[p],col,h)};
  mk('G',-8.8,2.9,1,'purple',0.8);mk('C3',-7.4,2.9,3,'yellow',1.0);mk('C2',-6.0,2.9,4,'yellow',1.1);mk('C1',-4.6,2.9,5,'yellow',1.2);mk('C0',-3.2,2.9,6,'yellow',1.3);
  mk('B',-8.8,-3.6,2,'orange',1.4);mk('A',-7.4,-3.6,14,'orange',1.1);
  wire(P[15],V(P[15].x,b.railP),'red',0.3);
  this.leds.Y=led(6.8,2.9,'1Y');wire(P[7],V(6.8,2.7),'green',1.0);
  camera.position.set(0,14.5,12.5);controls.target.set(0,0,-0.2)},
 state(){const s=this.st;return[['Voie choisie',s.G?'aucune (G = 1)':'C'+(s.B*2+s.A)],['Y',this.out().Y]]},
 table(){const s=this.st;const H=x=>x?'H':'L';
  const rows=[['X','X','X','X','X','X','H','L'],['L','L','L','X','X','X','L','L'],['L','L','H','X','X','X','L','H'],['L','H','X','L','X','X','L','L'],['L','H','X','H','X','X','L','H'],['H','L','X','X','L','X','L','L'],['H','L','X','X','H','X','L','H'],['H','H','X','X','X','L','L','L'],['H','H','X','X','X','H','L','H']];
  const c=s.G?0:1+(s.B*2+s.A)*2+s['C'+(s.B*2+s.A)];return{head:['B','A','C0','C1','C2','C3','G','Y'],rows,cur:c}}});

/* ----- TP2 f : décodeur BCD 7447 ----- */
const D47=['abcdef','bc','abdeg','abcdg','bcfg','acdfg','cdefg','abc','abcdefg','abcfg','deg','cdg','bfg','adfg','defg',''];
EXP.bcd=comb({tab:'Décodeur 7447',title:'Décodeur BCD 7447 + afficheur 7 segments',ref:'Brochage du polycopié (figure 16) · Vcc 16, GND 8',
 desc:'Le code BCD D C B A (0000 à 1001) est converti en 7 signaux qui allument les segments. Essaie aussi les codes 1010 à 1111.',
 note:'Le 7447 affiche 6 sans le segment a et 9 sans le segment d. Pour 10 à 15 il affiche des symboles particuliers, et 1111 éteint tout. Ses sorties sont actives à l\'état bas : afficheur à anode commune.',
 inputs:['D','C','B','A'],sigs:['D','C','B','A'],outputs:[],
 build(){const b=board(19,10.5);const P=chip('7447',16,0.4,-1.2,['B','C','LT','RBO','RBI','D','A','GND','e','d','c','b','a','g','f','Vcc']);powerChip(P,16,b);
  const pin={D:6,C:2,B:1,A:7};['D','C','B','A'].forEach((k,i)=>{const w=this.mkSw(k,-8.4+i*1.4,2.7);wire(w.pos,P[pin[k]],'orange',0.8+i*0.25)});
  [3,4,5].forEach(p=>wire(P[p],V(P[p].x,b.railP2),'red',0.3));
  this.seg=sevenSeg(7.2,-1.2);const sp=this.seg.pins;[[13,'a'],[12,'b'],[11,'c'],[10,'d'],[9,'e'],[15,'f'],[14,'g']].forEach(([p,k],i)=>wire(P[p],sp[k],'white',0.4+i*0.08));
  camera.position.set(0,13.5,11.5);controls.target.set(0,0,0)},
 sync(){const s=this.st;this.seg.set(D47[s.D*8+s.C*4+s.B*2+s.A])},
 state(){const s=this.st,n=s.D*8+s.C*4+s.B*2+s.A;return[['DCBA',bits(n,4)],['Décimal',n],['Affichage',n<10?String(n):'symbole']]},
 table(){const s=this.st;return{head:['D C B A','N','a b c d e f g'],rows:D47.map((m,i)=>[bits(i,4),i,'abcdefg'.split('').map(k=>m.includes(k)?1:0).join(' ')]),cur:s.D*8+s.C*4+s.B*2+s.A}}});

/* ---------- onglets ---------- */
const TPS=[{k:'tp1',label:'TP1',title:'Les circuits logiques',tabs:['portes','c1','c2','abs','maj','dem']},
 {k:'tp2',label:'TP2',title:'Les opérateurs logiques et arithmétiques',tabs:['hex','ual','cmp','add','mux','bcd']},
 {k:'tp3',label:'TP3',title:'Les circuits logiques séquentiels',tabs:['rs','rsh','jkme','jk','cpt','reg']}];
const tpOf=key=>TPS.find(t=>t.tabs.includes(key));
TPS.forEach(t=>{const b=document.createElement('button');b.className='tp';b.dataset.k=t.k;b.textContent=t.label;b.title=t.title;b.onclick=()=>load(t.tabs[0]);$('tps').appendChild(b)});
function load(key){
  setAuto(false);clearScene();cur=EXP[key];hist=[];sigNames=cur.sigs;
  const T=tpOf(key);$('tpTitle').textContent=T.title;document.title=T.title;
  document.querySelectorAll('.tp').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===T.k));
  $('tabs').innerHTML='';T.tabs.forEach(k=>{const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.dataset.k=k;b.textContent=EXP[k].tab;b.setAttribute('aria-selected',k===key);b.onclick=()=>load(k);$('tabs').appendChild(b)});
  $('ttl').textContent=cur.title;$('ref').textContent=cur.ref;$('desc').textContent=cur.desc;$('note').textContent=cur.note;
  cur.build();cur.log?cur.log():record(Object.fromEntries(cur.sigs.map(s=>[s,0])));
  if(key==='rs'){const s=cur.st;record({S:s.S,R:s.R,Q:s.Q,'Q̄':s.Qb});}
  refresh();
  try{localStorage.setItem('elecTab',key)}catch(e){}
}

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();drawChrono()}
new ResizeObserver(resize).observe(stage);new ResizeObserver(drawChrono).observe($('chrono'));
let start='portes';try{const t=localStorage.getItem('elecTab');if(EXP[t])start=t}catch(e){}
load(start);resize();
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
})();
</script>
